version: "3.8"

services:
  monolith:
    build:
      context: ../monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
      - ../../booking-service/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - hotelio-net

  booking-service-db:
    image: postgres:15
    container_name: booking-service-db
    environment:
      POSTGRES_USER: booking-service
      POSTGRES_PASSWORD: booking-service
      POSTGRES_DB: booking-service
    ports:
      - "5433:5432"
    volumes:
      - booking-service-db-data:/var/lib/postgresql/data
      - ../../booking-service/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - hotelio-net

  booking-service:
    build:
      context: ../../booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "9090:9090"
    networks:
      - hotelio-net
    environment:
      DATABASE_URL: postgresql://booking-service:booking-service@booking-service-db:5432/booking-service
      MONOLITH_URL: http://monolith:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOKING_TOPIC: booking-events
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 1
    depends_on:
      booking-service-db:
        condition: service_started
      kafka:
        condition: service_healthy

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-history-service:
    build:
      context: ../../booking-history-service
      dockerfile: Dockerfile
    container_name: booking-history-service
    ports:
      - "8001:8000"
    networks:
      - hotelio-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOKING_TOPIC: booking-events
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  monolith-db-data:
  booking-service-db-data:

networks:
  hotelio-net:
    external: true
